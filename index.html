<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 4 - DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="panel">
        <h2>Panel Interaktif</h2>
        <button id="btnTema">Mode Gelap</button>

        <h3>Penghitung</h3>
        <p id="angka" class="angka">0</p>
        <button id="kurang">−</button>
        <button id="reset">Reset</button>
        <button id="tambah">+</button>

        <h3>Ganti Warna Kotak</h3>
        <div id="kotak" class="kotak" title="Klik ganda (double click) untuk mengembalikan warna ke abu-abu"></div>
        <button class="warna" data-warna="#ef4444">Merah</button>
        <button class="warna" data-warna="#22c55e">Hijau</button>
        <button class="warna" data-warna="#3b82f6">Biru</button>
        <!-- Tombol warna keempat (Kuning) sesuai Pertanyaan Analisis No. 2 -->
        <button class="warna" data-warna="#eab308">Kuning</button>
    </div>
</body>
</html>
